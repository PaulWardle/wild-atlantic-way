name: Deploy to Cloudflare

# Auto-deploy: every push to the live branch builds the app and ships it to the
# same Cloudflare Worker (wild-atlantic-way), so the URL stays identical and the
# newest commit is always what's served. You can also trigger a deploy by hand
# from the repo's Actions tab (Run workflow).
#
# Setup (one time): add two repository secrets under
# Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   – a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account ID
# Until those exist the workflow still runs green: it builds, then skips the
# deploy with a note instead of failing.
on:
  push:
    branches: [claude/new-session-lix9tz]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped (no token yet)
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "::warning::Build OK, but CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions to turn on auto-deploy."
